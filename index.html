<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ミテちゃんは最強だぜ！</title><link rel="stylesheet" href="style.css"></head>
<body><header><span class="badge">SORA RC 0.99</span><h1>ミテちゃんは最強だぜ！</h1><span class="tag">RC 0.99</span></header>
<main class="console"><section class="controls left" aria-label="移動"><span class="label">MOVE</span><div class="direction"><button data-action="left" aria-label="左へ移動">←</button><button data-action="right" aria-label="右へ移動">→</button></div><small>押しっぱなしで移動</small></section><section class="screen"><canvas id="game" width="640" height="360" aria-label="夜の商店街を歩くゲーム画面"></canvas><p id="loading">読み込み中…</p></section><section class="controls right" aria-label="アクション"><span class="label">ACTION</span><div class="actions"><div><button class="jump" data-action="jump" aria-label="B ジャンプ">B</button><small>ジャンプ</small></div><div><button class="punch" data-action="punch" aria-label="A パンチ">A</button><small>パンチ</small></div></div><small>移動と同時押し OK</small></section></main>
<footer>← → / A D：移動 <span> Z：パンチ　X：ジャンプ</span></footer><aside class="rotate">スマホを横向きにして遊んでね ↻</aside>
<script src="js/audio.js"></script><script src="js/input.js"></script><script src="js/stage.js"></script><script src="js/player.js"></script><script src="js/enemies.js"></script><script src="js/game.js"></script></body></html>
