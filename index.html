<style>

header h1{font-size:clamp(13px,2vw,23px);margin:0;font-weight:950;letter-spacing:.02em}.badge{background:#f6c943;color:#17202c;padding:4px 8px;border-radius:5px;font:900 10px/1 monospace;letter-spacing:.08em}.tag{margin-left:auto;font:700 9px/1 monospace;color:#93a1b5}
.console{display:grid;grid-template-columns:clamp(86px,14vw,160px) minmax(0,1fr) clamp(126px,19vw,205px);gap:6px;width:min(1220px,100%);padding:8px 5px;background:linear-gradient(#39485c,#283647);border:1px solid #617089;border-radius:22px;box-shadow:0 7px 0 #05090f,0 18px 36px #0008;align-items:center}

button.ctrl.round{border-radius:50%;color:#17202c}.jump{background:#cad9e0!important;border-color:#f0fbff!important}.punch{background:#f6ca42!important;border-color:#ffe7a0!important}.special{background:#2f6ddb!important;border-color:#7bd7ff!important;color:#fff!important;box-shadow:0 4px 0 #091f4e,0 0 0 2px #08152a!important}.special.ready{animation:pulse .55s steps(2,end) infinite;background:#37b9ff!important;box-shadow:0 4px 0 #091f4e,0 0 17px #39d8ff!important}.special:not(.ready){filter:saturate(.58) brightness(.76)}

@media(orientation:portrait){.console{grid-template-columns:74px minmax(0,1fr) 102px;gap:2px;padding:6px 2px}.controls{gap:5px}.direction{gap:2px}button.ctrl{width:36px;height:40px;font-size:18px}header{margin-bottom:4px}.tag{display:none}.rotate{display:block;position:absolute;bottom:7%;color:#f6ca42;font:800 12px monospace;pointer-events:none}footer{display:none}}
@media (orientation:landscape) and (max-height:500px){body{padding:max(2px,env(safe-area-inset-top)) max(5px,env(safe-area-inset-right)) max(2px,env(safe-area-inset-bottom)) max(5px,env(safe-area-inset-left))}header{height:20px;margin-bottom:3px}.badge{padding:3px 5px;font-size:8px}header h1{font-size:12px}.tag{font-size:8px}.console{grid-template-columns:clamp(78px,12.5vw,130px) minmax(0,1fr) clamp(118px,17.5vw,176px);padding:4px 3px;gap:3px;border-radius:15px;box-shadow:0 5px 0 #05090f,0 8px 20px #0008}.screen{max-width:calc((100dvh - 46px)*16/9);justify-self:center;width:100%;border-width:3px}.controls{gap:4px}.label{font-size:7px}button.ctrl{width:clamp(35px,4.8vw,48px);height:clamp(35px,4.8vw,48px);font-size:19px}.actions{gap:3px 6px}.controls>.hint{display:none}footer{display:none}}

<body>
<header><span class="badge">SORA RC 1.05</span><h1>ミテちゃんは最強だぜ！</h1><span class="tag">REVISION PROTOTYPE</span></header>
<main class="console">
  <section class="controls" aria-label="移動"><span class="label">MOVE</span><div class="direction"><button class="ctrl" data-action="left" aria-label="左へ移動">←</button><button class="ctrl" data-action="right" aria-label="右へ移動">→</button></div><small class="hint">押しっぱなしで移動</small></section>
  <section class="screen"><canvas id="game" width="640" height="360" aria-label="ミテちゃんは最強だぜ！ゲーム画面"></canvas><p id="loading">読み込み中…</p><div id="modal"><div class="panel" id="modalPanel"><h2 id="modalTitle"></h2><p id="modalText"></p><button id="modalButton" class="modal-btn"></button></div></div></section>
  <section class="controls" aria-label="アクション"><span class="label">ACTION</span><div class="actions"><div class="jumpwrap"><button class="ctrl round jump" data-action="jump">B</button><small>ジャンプ</small></div><div class="punchwrap"><button class="ctrl round punch" data-action="punch">A</button><small>パンチ</small></div><div class="specialwrap"><button class="ctrl round special" data-action="special">必</button><small>必殺技</small></div></div><small class="hint">POWER MAXで発動！</small></section>
</main>
<footer>← → / A D：移動　Z：パンチ　X：ジャンプ　V：必殺技</footer><aside class="rotate">スマホを横向きにして遊んでね ↻</aside>
<script>
'use strict';
(()=>{
const C=document.getElementById('game'),ctx=C.getContext('2d');ctx.imageSmoothingEnabled=false;const W=640,H=360,FLOOR=306,STAGE_W=3600;
const loading=document.getElementById('loading'),modal=document.getElementById('modal'),modalPanel=document.getElementById('modalPanel'),modalTitle=document.getElementById('modalTitle'),modalText=document.getElementById('modalText'),modalButton=document.getElementById('modalButton');
const imgs={};const sources={stage1:'assets/stage1_night_street.png',title:'assets/title_screen.png',special:'assets/special_cutin.png',boss1:'assets/boss1_cutin.png',boss2:'assets/boss2_cutin.png'};
const loadImage=(k,s)=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>{imgs[k]=im;res()};im.onerror=rej;im.src=s});
Promise.all(Object.entries(sources).map(([k,s])=>loadImage(k,s))).then(()=>{loading.style.display='none';requestAnimationFrame(loop)}).catch(()=>{loading.textContent='画像を読み込めません。フォルダごと展開して index.html を開いてください。'});

// ---------- input ----------
const sourcesDown=new Map(),buttons=[...document.querySelectorAll('[data-action]')];
function actionDown(a){return [...sourcesDown.values()].includes(a)}
function paintButtons(){buttons.forEach(b=>b.classList.toggle('held',actionDown(b.dataset.action)))}
buttons.forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch{}sourcesDown.set('p'+e.pointerId,b.dataset.action);paintButtons();audio.unlock();});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,e=>{sourcesDown.delete('p'+e.pointerId);paintButtons()}));});
const keyMap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',KeyZ:'punch',KeyX:'jump',KeyV:'special'};
addEventListener('keydown',e=>{if(keyMap[e.code]){e.preventDefault();sourcesDown.set(e.code,keyMap[e.code]);paintButtons();audio.unlock();}});addEventListener('keyup',e=>{if(keyMap[e.code]){e.preventDefault();sourcesDown.delete(e.code);paintButtons();}});addEventListener('blur',()=>{sourcesDown.clear();paintButtons()});document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

// ---------- audio ----------
const audio=(()=>{let ac=null,unlocked=false;const get=()=>{try{ac||=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}catch{return null}};const tone=(f,d=.06,type='square',v=.035,slide=0)=>{const a=get();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(45,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)};const noise=(d=.045,v=.025)=>{const a=get();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),data=b.getChannelData(0);for(let i=0;i<n;i++)data[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(a.destination);s.start()};return{unlock(){get();unlocked=true},punch(n=1){tone(165+n*24,.04,'square',.022,55)},jump(){tone(300,.08,'square',.025,210)},hit(big=false){noise(big?.07:.04,big?.05:.03);tone(big?90:125,big?.08:.045,'square',.024,-40)},hurt(){noise(.07,.035);tone(95,.11,'sawtooth',.03,-35)},boss(){noise(.08,.04);tone(92,.22,'sawtooth',.04,-22);setTimeout(()=>tone(70,.22,'sawtooth',.035,-15),150)},cutin(){noise(.07,.055);tone(170,.12,'sawtooth',.035,520);setTimeout(()=>tone(520,.1,'square',.025,520),70)},special(){noise(.14,.055);[130,185,270,430].forEach((f,i)=>setTimeout(()=>tone(f,.18,'sawtooth',.036,210),i*55))},power(){[440,660,880].forEach((f,i)=>setTimeout(()=>tone(f,.08,'square',.022,35),i*65))},clear(){[392,523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.15,'square',.03,18),i*105))},gameover(){[220,165,110].forEach((f,i)=>setTimeout(()=>tone(f,.2,'square',.026,-20),i*150))},slam(){noise(.15,.07);tone(70,.18,'sawtooth',.035,-20)}}})();

const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let state='title',stageNum=1,cameraX=0,score=0,shake=0,flash=0,banner='',bannerT=0,cutin=null,cutinT=0,stageClearT=0,pendingStage2=false,specialCutinT=0,specialSpawnT=0,powerReadyPlayed=false,bossArena=false,bossEntered=false;
let enemies=[],projectiles=[],sparks=[],boss=null;

const player={x:160,y:FLOOR,vy:0,facing:1,hp:100,maxHp:100,power:0,maxPower:100,inv:0,hitstun:0,attack:0,attackId:0,hitIds:new Set(),combo:0,comboGrace:0,punchLatch:false,jumpLatch:false,specialLatch:false,dead:false,
 reset(full=true){this.x=160;this.y=FLOOR;this.vy=0;this.facing=1;if(full)this.hp=100;this.power=0;this.inv=0;this.hitstun=0;this.attack=0;this.hitIds.clear();this.combo=0;this.comboGrace=0;this.punchLatch=false;this.jumpLatch=false;this.specialLatch=false;this.dead=false;powerReadyPlayed=false},
 body(){return{x:this.x-18,y:this.y-78,w:36,h:78}},
 hitbox(){if(this.attack<=0)return null;const active=this.attack>.055&&this.attack<(this.combo===3?.25:.19);if(!active)return null;return{x:this.facing>0?this.x+14:this.x-66,y:this.y-70,w:this.combo===3?58:48,h:30}},
 addPower(v=10){const before=this.power;this.power=Math.min(100,this.power+v);if(before<100&&this.power===100&&!powerReadyPlayed){powerReadyPlayed=true;audio.power()}},
 hurt(d,from){if(this.inv>0||this.dead)return;this.hp=Math.max(0,this.hp-d);this.inv=.82;this.hitstun=.28;this.attack=0;this.x+=this.x<from?-24:24;audio.hurt();if(this.hp<=0){this.dead=true;setTimeout(()=>gameOver(),260)}},
 startPunch(){this.combo=this.comboGrace>0?(this.combo%3)+1:1;this.comboGrace=.52;this.attack=this.combo===3?.34:.27;this.attackId++;this.hitIds.clear();audio.punch(this.combo)},
 update(dt){this.inv=Math.max(0,this.inv-dt);this.hitstun=Math.max(0,this.hitstun-dt);this.comboGrace=Math.max(0,this.comboGrace-dt);if(this.attack<=0&&this.comboGrace<=0)this.combo=0;const dir=this.hitstun>0?0:Number(actionDown('right'))-Number(actionDown('left'));if(dir){this.facing=dir;this.x+=dir*188*dt}const j=actionDown('jump');if(j&&!this.jumpLatch&&this.y>=FLOOR&&this.hitstun<=0){this.vy=-520;this.jumpLatch=true;audio.jump()}if(!j)this.jumpLatch=false;this.vy+=1450*dt;this.y+=this.vy*dt;if(this.y>FLOOR){this.y=FLOOR;this.vy=0}const p=actionDown('punch');if(!p)this.punchLatch=false;if(this.attack>0)this.attack=Math.max(0,this.attack-dt);if(p&&!this.punchLatch&&this.hitstun<=0&&this.attack<=.07){this.startPunch();this.punchLatch=true}let minX=36,maxX=STAGE_W-42;if(bossArena){minX=2965;maxX=3265}this.x=clamp(this.x,minX,maxX);}
};

class Enemy{constructor(kind,x,hp,w=42,h=78){this.kind=kind;this.x=x;this.spawnX=x;this.y=FLOOR;this.hp=hp;this.maxHp=hp;this.w=w;this.h=h;this.dead=false;this.remove=false;this.cool=.7+Math.random();this.hitFlash=0;this.vx=0;this.stun=0;this.isBoss=false;this.entered=true;this.phase=0}body(){return{x:this.x-this.w/2,y:this.y-this.h,w:this.w,h:this.h}}damage(d,dir,strong=false){if(this.dead)return false;this.hp=Math.max(0,this.hp-d);this.hitFlash=.14;this.stun=strong?.24:.12;this.x+=dir*(strong?20:9);audio.hit(strong);if(this.hp<=0){this.dead=true;this.cool=.45;this.vx=dir*(strong?250:175);sparks.push({x:this.x,y:this.y-this.h*.55,t:.33,big:true});score+=this.isBoss?800:220;return true}return false}update(dt){this.hitFlash=Math.max(0,this.hitFlash-dt);this.stun=Math.max(0,this.stun-dt);if(this.dead){this.x+=this.vx*dt;this.vx*=.93;this.cool-=dt;if(this.cool<=0)this.remove=true;return}if(this.stun>0)return;const dx=player.x-this.x,ad=Math.abs(dx),dir=Math.sign(dx)||1;this.cool-=dt;if(this.kind==='yankee'){if(ad>45)this.x+=dir*76*dt;else if(this.cool<=0){this.cool=.9;if(overlap(this.body(),player.body()))player.hurt(10,this.x)}}else if(this.kind==='ninja'){if(ad>145)this.x+=dir*112*dt;if(this.cool<=0){this.cool=1.8;projectiles.push(new Acorn(this.x-dir*3,this.y-48,dir))}}else if(this.kind==='horse'){if(this.phase===0){if(this.cool<=0){this.cool=2.3;this.vx=dir*360;this.phase=1}else if(ad>170)this.x+=dir*46*dt}if(this.phase===1){this.x+=this.vx*dt;if(overlap(this.body(),player.body())){player.hurt(16,this.x);this.vx=0;this.phase=2;this.cool=.6}if(Math.abs(this.x-this.spawnX)>260){this.vx=0;this.phase=2;this.cool=.6}}if(this.phase===2){if(ad>50)this.x+=dir*72*dt;else if(this.cool<=0){this.cool=1.0;if(overlap(this.body(),player.body()))player.hurt(12,this.x)}}}else if(this.kind==='daichi'){if(!this.entered)return;if(ad>60)this.x+=dir*70*dt;else if(this.cool<=0){this.cool=1.0+Math.random()*.45;if(overlap(this.body(),player.body()))player.hurt(Math.random()<.35?16:12,this.x)}}else if(this.kind==='soldier'){if(ad>48)this.x+=dir*78*dt;else if(this.cool<=0){this.cool=.95;if(overlap(this.body(),player.body()))player.hurt(11,this.x)}}else if(this.kind==='assault'){if(ad>135)this.x+=dir*96*dt;if(this.cool<=0){this.cool=1.55;projectiles.push(new Bullet(this.x,this.y-55,dir))}}else if(this.kind==='tank'){if(ad>115)this.x+=dir*33*dt;if(this.cool<=0){this.cool=2.2;projectiles.push(new Shell(this.x,this.y-58,dir))}}}
 draw(){const sx=this.x-cameraX;if(sx<-100||sx>740)return;ctx.save();ctx.translate(Math.round(sx),Math.round(this.y));if(this.dead)ctx.rotate(this.vx>0?.65:-.65);if(this.hitFlash>0){ctx.globalAlpha=.65+Math.random()*.35}const c=this.kind==='yankee'?'#6bc0ff':this.kind==='ninja'?'#6140a8':this.kind==='horse'?'#8e5d3b':this.kind==='daichi'?'#1b1b1f':this.kind==='soldier'?'#667c4f':this.kind==='assault'?'#8a4d4d':'#5d6570';if(this.kind==='tank'){drawTank(0,0,this.hitFlash>0);ctx.restore();return}drawPerson(0,0,c,this.kind==='daichi'?1.25:this.kind==='horse'?1.14:1,this.kind);ctx.restore();if(!this.isBoss&&!this.dead){const bw=34;ctx.fillStyle='#1b2638';ctx.fillRect(sx-bw/2,this.y-this.h-11,bw,4);ctx.fillStyle='#ff5678';ctx.fillRect(sx-bw/2,this.y-this.h-11,bw*this.hp/this.maxHp,4)}}}
class StageBoss extends Enemy{constructor(x){super('warboss',x,12,88,128);this.isBoss=true;this.entered=false;this.cool=1.1;this.raise=0;this.slam=0}body(){return{x:this.x-44,y:this.y-128,w:88,h:128}}update(dt){this.hitFlash=Math.max(0,this.hitFlash-dt);this.stun=Math.max(0,this.stun-dt);if(!this.entered||this.dead){if(this.dead){this.cool-=dt;if(this.cool<=0)this.remove=true}return}this.x=3380;this.cool-=dt;this.raise=Math.max(0,this.raise-dt);this.slam=Math.max(0,this.slam-dt);if(this.stun>0)return;if(this.cool<=0){this.cool=2.65;this.raise=.42;setTimeout(()=>{if(!this.dead&&state==='play'&&stageNum===2){this.slam=.28;audio.slam();shake=.42;flash=.14;projectiles.push(new GroundWave(this.x-58,FLOOR-6,-1));}},390)}}draw(){const sx=this.x-cameraX;if(sx<-100||sx>740)return;ctx.save();ctx.translate(Math.round(sx),FLOOR);if(this.dead){ctx.rotate(-.45);ctx.translate(-15,0)}const scale=1.45;ctx.scale(scale,scale);const col=this.hitFlash>0?'#f7f7f7':'#57412d';drawWarBoss(0,0,col,this.raise>0,this.slam>0);ctx.restore();}}
class Acorn{constructor(x,y,dir){this.x=x;this.y=y;this.vx=dir*175;this.vy=-42;this.t=3;this.remove=false}update(dt){this.vy+=240*dt;this.x+=this.vx*dt;this.y+=this.vy*dt;this.t-=dt;if(overlap({x:this.x-7,y:this.y-7,w:14,h:14},player.body())){player.hurt(9,this.x);this.remove=true}if(this.t<0||this.y>FLOOR+20)this.remove=true}draw(){const x=this.x-cameraX,y=this.y;ctx.fillStyle='#6a3d1f';ctx.fillRect(x-6,y-5,12,10);ctx.fillStyle='#ad6c2e';ctx.fillRect(x-5,y-4,10,6);ctx.fillStyle='#3c6e37';ctx.fillRect(x-1,y-9,3,5)}}
class Bullet{constructor(x,y,dir){this.x=x;this.y=y;this.vx=dir*255;this.t=2.6;this.remove=false}update(dt){this.x+=this.vx*dt;this.t-=dt;if(overlap({x:this.x-5,y:this.y-3,w:10,h:6},player.body())){player.hurt(10,this.x);this.remove=true}if(this.t<0)this.remove=true}draw(){ctx.fillStyle='#ffb23e';ctx.fillRect(this.x-cameraX-5,this.y-2,10,4);ctx.fillStyle='#fff4b1';ctx.fillRect(this.x-cameraX+2,this.y-1,5,2)}}
class Shell{constructor(x,y,dir){this.x=x;this.y=y;this.vx=dir*185;this.vy=-40;this.t=3;this.remove=false}update(dt){this.vy+=180*dt;this.x+=this.vx*dt;this.y+=this.vy*dt;this.t-=dt;if(overlap({x:this.x-9,y:this.y-9,w:18,h:18},player.body())){player.hurt(18,this.x);this.remove=true;shake=.18}if(this.t<0||this.y>FLOOR+20)this.remove=true}draw(){ctx.fillStyle='#2b3038';ctx.fillRect(this.x-cameraX-8,this.y-6,16,12);ctx.fillStyle='#ff6a32';ctx.fillRect(this.x-cameraX-11,this.y-3,4,6)}}
class GroundWave{constructor(x,y,dir){this.x=x;this.y=y;this.dir=dir;this.t=2.1;this.remove=false}update(dt){this.x+=this.dir*320*dt;this.t-=dt;if(overlap({x:this.x-28,y:FLOOR-25,w:56,h:25},player.body())){player.hurt(25,this.x);this.remove=true}if(this.t<0||this.x<2860)this.remove=true}draw(){const x=this.x-cameraX;ctx.fillStyle='#f4b24e';ctx.beginPath();ctx.moveTo(x-24,FLOOR);ctx.lineTo(x-13,FLOOR-18);ctx.lineTo(x-4,FLOOR-6);ctx.lineTo(x+7,FLOOR-25);ctx.lineTo(x+16,FLOOR-7);ctx.lineTo(x+28,FLOOR);ctx.fill();ctx.fillStyle='#fff0a1';ctx.fillRect(x-20,FLOOR-4,40,3)}}
class Dragon{constructor(x,y,dir){this.x=x;this.y=y;this.dir=dir;this.t=3.3;this.remove=false;this.hit=new Set();this.age=0}update(dt){this.age+=dt;this.t-=dt;this.x+=this.dir*108*dt;const box={x:this.dir>0?this.x-210:this.x-90,y:this.y-76,w:300,h:105};for(const e of enemies){if(e.dead||this.hit.has(e))continue;if(overlap(box,e.body())){this.hit.add(e);const dmg=stageNum===2&&e.isBoss?3:5;e.damage(dmg,this.dir,true);score+=e.isBoss?700:300;sparks.push({x:e.x,y:e.y-e.h*.6,t:.34,big:true});shake=.3;flash=.12}}if(this.t<=0||this.x<-300||this.x>STAGE_W+300)this.remove=true}draw(){const sx=this.x-cameraX;ctx.save();ctx.translate(sx,this.y);ctx.scale(this.dir,1);ctx.globalCompositeOperation='lighter';const pulse=1+Math.sin(this.age*23)*.04;ctx.scale(pulse,pulse);for(let i=0;i<8;i++){const bx=-i*28,by=Math.sin(this.age*9-i*.8)*7;ctx.fillStyle=`rgba(${45+i*8},${160+i*10},255,${.58-i*.045})`;ctx.beginPath();ctx.arc(bx,by,28-i*1.7,0,Math.PI*2);ctx.fill()}// head at the FRONT: positive X in local coordinates
ctx.translate(34,0);ctx.fillStyle='#89f4ff';ctx.beginPath();ctx.moveTo(58,0);ctx.lineTo(22,-33);ctx.lineTo(-16,-27);ctx.lineTo(-4,-8);ctx.lineTo(-25,0);ctx.lineTo(-4,9);ctx.lineTo(-16,29);ctx.lineTo(24,34);ctx.closePath();ctx.fill();ctx.fillStyle='#eaffff';ctx.fillRect(23,-15,12,8);ctx.fillStyle='#0b4f83';ctx.fillRect(30,-13,4,4);ctx.fillStyle='#fff';for(let i=0;i<4;i++)ctx.fillRect(16+i*9,8,5,10);ctx.strokeStyle='#48d8ff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(22,-28);ctx.quadraticCurveTo(58,-52,80,-30);ctx.moveTo(25,28);ctx.quadraticCurveTo(61,50,83,30);ctx.stroke();ctx.restore()}}

function drawPerson(x,y,color,scale=1,kind=''){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);const skin='#e7b087';ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(-17,-4,34,4);ctx.fillStyle=color;ctx.fillRect(-15,-55,30,39);ctx.fillStyle=skin;ctx.fillRect(-12,-78,24,23);ctx.fillStyle=kind==='ninja'?'#1b1528':kind==='daichi'?'#050608':'#2b2a2a';ctx.fillRect(-13,-82,26,8);if(kind==='daichi'){ctx.fillStyle='#fff';ctx.font='bold 7px monospace';ctx.fillText('JL',-6,-75)}ctx.fillStyle='#171b22';ctx.fillRect(-13,-16,10,16);ctx.fillRect(3,-16,10,16);ctx.fillStyle='#eee';ctx.fillRect(-14,-3,12,4);ctx.fillRect(2,-3,12,4);ctx.fillStyle=skin;ctx.fillRect(-24,-50,10,10);ctx.fillRect(14,-50,10,10);ctx.restore()}
function drawTank(x,y,hit){ctx.fillStyle=hit?'#fff':'#4f5c49';ctx.fillRect(-34,-34,68,28);ctx.fillRect(-22,-48,38,18);ctx.fillStyle='#263128';ctx.fillRect(-28,-54,48,7);ctx.fillRect(12,-49,43,6);ctx.fillStyle='#15191c';for(let i=-25;i<=23;i+=16){ctx.beginPath();ctx.arc(i,-4,8,0,Math.PI*2);ctx.fill()}}
function drawWarBoss(x,y,col,raise,slam){ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(-38,-4,76,4);ctx.fillStyle=col;ctx.fillRect(-31,-83,62,63);ctx.fillStyle='#a36b47';ctx.fillRect(-25,-112,50,34);ctx.fillStyle='#252a24';ctx.fillRect(-35,-86,16,58);ctx.fillRect(19,-86,16,58);ctx.fillStyle='#141820';ctx.fillRect(-28,-20,20,20);ctx.fillRect(8,-20,20,20);ctx.fillStyle='#0b0b0d';ctx.fillRect(-21,-104,8,5);ctx.fillRect(13,-104,8,5);if(raise){ctx.fillStyle='#a36b47';ctx.fillRect(-48,-121,16,55);ctx.fillRect(32,-121,16,55)}if(slam){ctx.fillStyle='#ffb14b';ctx.fillRect(-56,-9,112,7)}ctx.restore()}
function drawPlayer(){const sx=player.x-cameraX,sy=player.y,blink=player.inv>0&&Math.floor(performance.now()/70)%2;if(blink)return;ctx.save();ctx.translate(Math.round(sx),Math.round(sy));ctx.scale(player.facing,1);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(-20,-3,40,3);ctx.fillStyle='#f7c928';ctx.fillRect(-17,-50,34,35);ctx.fillStyle='#d89a27';ctx.fillRect(-15,-18,11,18);ctx.fillRect(4,-18,11,18);ctx.fillStyle='#fff';ctx.fillRect(-17,-4,13,5);ctx.fillRect(4,-4,13,5);ctx.fillStyle='#f0b28c';ctx.fillRect(-13,-75,26,25);ctx.fillStyle='#633a2e';ctx.fillRect(-15,-78,30,8);ctx.fillRect(-23,-66,10,19);ctx.fillRect(13,-66,10,19);ctx.fillStyle='#ffd42f';ctx.fillRect(-16,-82,32,8);ctx.fillStyle='#4b9f42';ctx.fillRect(-2,-85,6,7);ctx.fillStyle='#111';ctx.fillRect(3,-67,3,3);if(player.attack>0){ctx.fillStyle='#f0b28c';ctx.fillRect(14,-52,28,10);ctx.fillStyle='#fff2be';ctx.fillRect(37,-55,10,15);if(player.combo===3){ctx.fillStyle='#ffe153';ctx.fillRect(46,-61,9,4);ctx.fillRect(50,-50,11,4)}}else{ctx.fillStyle='#f0b28c';ctx.fillRect(14,-52,11,10);ctx.fillRect(-25,-52,11,10)}ctx.restore()}

function spawn1(){enemies=[new Enemy('yankee',720,3),new Enemy('yankee',1120,3),new Enemy('yankee',1510,3),new Enemy('ninja',1635,2),new Enemy('yankee',1735,3),new Enemy('ninja',2140,2),new Enemy('horse',2550,6)];boss=new Enemy('daichi',3200,10,62,94);boss.isBoss=true;boss.entered=false;enemies.push(boss)}
function spawn2(){enemies=[new Enemy('soldier',700,3),new Enemy('soldier',1030,3),new Enemy('assault',1450,2),new Enemy('soldier',1585,3),new Enemy('assault',1740,2),new Enemy('tank',2200,5,76,52),new Enemy('soldier',2360,3)];boss=new StageBoss(3380);enemies.push(boss)}
function resetStage(n=1,keepScore=false){state='play';hideModal();stageNum=n;player.reset(true);player.x=n===2?150:160;cameraX=0;if(!keepScore)score=0;shake=0;flash=0;banner=n===1?'STAGE 1  夜の商店街':'STAGE 2  戦場';bannerT=2.1;cutin=null;cutinT=0;stageClearT=0;pendingStage2=false;specialCutinT=0;specialSpawnT=0;bossArena=false;bossEntered=false;projectiles=[];sparks=[];powerReadyPlayed=false;if(n===1)spawn1();else spawn2()}
function showModal(title,text,button,danger=false,handler=null){modalTitle.textContent=title;modalText.textContent=text;modalButton.textContent=button;modalPanel.classList.toggle('danger',danger);modal.classList.add('show');modalButton.onclick=()=>{audio.unlock();handler&&handler()}}
function hideModal(){modal.classList.remove('show')}
function gameOver(){if(state!=='play')return;state='gameover';audio.gameover();showModal('ミテちゃんはまだ負けてない！','このステージの最初から再挑戦するよ。','CONTINUE',true,()=>resetStage(stageNum,true))}
function stageClear(){if(state!=='play')return;state='stageclear';stageClearT=2.0;audio.clear();banner='げーむくりあ！';bannerT=2.0;pendingStage2=stageNum===1;if(stageNum===2)setTimeout(()=>{if(state==='stageclear'){state='clear';showModal('げーむくりあ！','ミテちゃんは最強だぜ！　全2面クリア！','もう一度',false,()=>{state='title';hideModal();score=0})}},1500)}
function startSpecial(){if(player.power<100||player.dead||specialCutinT>0)return;player.power=0;powerReadyPlayed=false;specialCutinT=.80;specialSpawnT=.30;audio.cutin();shake=.1;flash=.06}

function handleHits(){const hb=player.hitbox();if(!hb)return;for(const e of enemies){if(e.dead||player.hitIds.has(e))continue;if(overlap(hb,e.body())){player.hitIds.add(e);const dmg=player.combo===3?2:1;e.damage(dmg,player.facing,player.combo===3);player.addPower(10);score+=e.isBoss?260:100;sparks.push({x:e.x,y:e.y-e.h*.55,t:.22,big:player.combo===3});shake=Math.max(shake,player.combo===3?.12:.05);if(e.isBoss&&e.hp<=0)setTimeout(stageClear,460)}}}
function waveAlive(a,b){return enemies.some(e=>!e.dead&&e.spawnX>=a&&e.spawnX<=b)}
function limitPlayerByGates(){let max=STAGE_W-42;if(stageNum===1){if(player.x>610&&waveAlive(620,920))max=930;else if(player.x>1050&&waveAlive(1050,1200))max=1240;else if(player.x>1390&&waveAlive(1400,1810))max=1810;else if(player.x>2010&&waveAlive(2020,2260))max=2300;else if(player.x>2420&&waveAlive(2420,2740))max=2770}else{if(player.x>610&&waveAlive(620,1120))max=1140;else if(player.x>1360&&waveAlive(1380,1810))max=1840;else if(player.x>2070&&waveAlive(2080,2450))max=2480}player.x=Math.min(player.x,max)}
function enterBossIfNeeded(){if(bossEntered||!boss||player.x<2860)return;bossEntered=true;boss.entered=true;bossArena=stageNum===2;cutin=stageNum===2?'boss2':'boss1';cutinT=1.45;audio.boss();if(stageNum===2){cameraX=2960;player.x=3010;boss.x=3380}else{boss.x=3200}}
function updateCamera(){if(bossArena){cameraX=2960;return}const target=clamp(player.x-190,0,STAGE_W-W);cameraX+=clamp(target-cameraX,-420/120,420/120)}
function update(dt){shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);bannerT=Math.max(0,bannerT-dt);cutinT=Math.max(0,cutinT-dt);for(const s of sparks)s.t-=dt;sparks=sparks.filter(s=>s.t>0);
 if(state==='stageclear'){stageClearT-=dt;if(pendingStage2&&stageClearT<=0){resetStage(2,true)}return}if(state!=='play')return;
 if(cutinT>0)return;
 if(specialCutinT>0){specialCutinT-=dt;if(specialCutinT<=0){audio.special();specialSpawnT=.30;banner='ハイパーウルトラ青龍波!!';bannerT=.72}return}
 if(specialSpawnT>0){specialSpawnT-=dt;if(specialSpawnT<=0){projectiles.push(new Dragon(player.x+player.facing*52,player.y-42,player.facing));shake=.3;flash=.14}}
 const sp=actionDown('special');if(!sp)player.specialLatch=false;if(sp&&!player.specialLatch){player.specialLatch=true;startSpecial()}
 player.update(dt);limitPlayerByGates();enterBossIfNeeded();for(const e of enemies)e.update(dt);for(const p of projectiles)p.update(dt);handleHits();enemies=enemies.filter(e=>!e.remove);projectiles=projectiles.filter(p=>!p.remove);updateCamera();if(boss&&boss.dead&&boss.remove)stageClear();}

function drawStage1(){const im=imgs.stage1,scale=H/im.height,dw=im.width*scale;let start=-((cameraX*.42)%dw);for(let x=start-dw;x<W+dw;x+=dw)ctx.drawImage(im,x,0,dw,H);ctx.fillStyle='rgba(2,8,18,.14)';ctx.fillRect(0,0,W,H)}
function drawStage2(){ctx.fillStyle='#291417';ctx.fillRect(0,0,W,H);ctx.fillStyle='#5c261c';ctx.fillRect(0,190,W,116);for(let i=0;i<12;i++){let x=((i*117-cameraX*.32)%760+760)%760-60;ctx.fillStyle=i%2?'#1b1a20':'#251f24';ctx.fillRect(x,70+(i%3)*25,75,145);ctx.fillStyle='#ff642d';for(let j=0;j<3;j++)ctx.fillRect(x+12+j*17,88+(i%3)*25,6,8)}ctx.fillStyle='#11151a';ctx.fillRect(0,FLOOR,W,H-FLOOR);for(let i=0;i<20;i++){const x=((i*83-cameraX)%760+760)%760-30;ctx.fillStyle='#48302b';ctx.fillRect(x,FLOOR+8,55,6)}ctx.fillStyle='rgba(255,70,25,.12)';ctx.fillRect(0,0,W,H)}
function drawHud(){const sp=document.querySelector('[data-action="special"]');sp.classList.toggle('ready',player.power>=100);ctx.fillStyle='rgba(5,15,32,.88)';ctx.fillRect(8,8,332,65);ctx.strokeStyle='#3e81ff';ctx.lineWidth=2;ctx.strokeRect(8,8,332,65);ctx.fillStyle='#ffd52f';ctx.fillRect(15,15,52,51);ctx.fillStyle='#3f291f';ctx.fillRect(29,24,24,19);ctx.fillStyle='#f2b18c';ctx.fillRect(30,30,22,20);ctx.fillStyle='#111';ctx.fillRect(44,37,3,3);ctx.fillStyle='#fff';ctx.font='bold 10px monospace';ctx.fillText('HP',77,23);ctx.fillStyle='#1c2940';ctx.fillRect(77,28,197,14);ctx.fillStyle=player.hp<=25?'#ff493f':'#ff316e';ctx.fillRect(77,28,197*player.hp/100,14);ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font='bold 9px monospace';ctx.fillText(player.hp+' / 100',331,39);ctx.textAlign='left';ctx.fillStyle='#ffd326';ctx.fillText('POWER',77,55);ctx.fillStyle='#1c2940';ctx.fillRect(122,47,152,12);ctx.fillStyle='#ffd326';ctx.fillRect(122,47,152*player.power/100,12);ctx.textAlign='right';ctx.fillStyle=player.power>=100?(Math.floor(performance.now()/110)%2?'#fff':'#ffd326'):'#fff';ctx.fillText(player.power>=100?'MAX!':player.power+' / 100',331,56);ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 10px monospace';ctx.textAlign='right';ctx.fillText('SCORE '+String(score).padStart(6,'0'),630,18);ctx.textAlign='left';ctx.fillStyle='#1a273b';ctx.fillRect(510,28,120,5);ctx.fillStyle='#f6ca42';ctx.fillRect(510,28,120*clamp(player.x/STAGE_W,0,1),5);if(player.hp<=25){ctx.fillStyle=Math.floor(performance.now()/150)%2?'#ff5767':'#ffd84a';ctx.fillText('! DANGER',348,55)}if(boss&&boss.entered&&!boss.dead){ctx.fillStyle='rgba(16,7,24,.9)';ctx.fillRect(177,79,286,28);ctx.strokeStyle='#df4bc1';ctx.strokeRect(177,79,286,28);ctx.fillStyle='#fff';ctx.fillText('BOSS',186,96);ctx.fillStyle='#2a1d36';ctx.fillRect(225,87,220,10);ctx.fillStyle='#ff2e68';ctx.fillRect(225,87,220*boss.hp/boss.maxHp,10);ctx.textAlign='right';ctx.fillText(boss.hp+' / '+boss.maxHp,456,96);ctx.textAlign='left'}}
function drawSpark(s){const x=s.x-cameraX,y=s.y,k=s.big?1.5:1;ctx.save();ctx.translate(x,y);ctx.scale(k,k);ctx.fillStyle='#ff5835';ctx.fillRect(-14,-2,28,4);ctx.fillRect(-2,-14,4,28);ctx.fillStyle='#ffd84a';ctx.fillRect(-10,-5,20,10);ctx.fillRect(-5,-10,10,20);ctx.fillStyle='#fff';ctx.fillRect(-3,-3,6,6);ctx.restore()}
function drawBanner(){if(bannerT<=0)return;ctx.fillStyle='rgba(3,8,17,.86)';ctx.fillRect(115,135,410,50);ctx.strokeStyle=banner.includes('青龍波')?'#4fdcff':'#f6ca42';ctx.lineWidth=2;ctx.strokeRect(117,137,406,46);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font=banner==='げーむくりあ！'?'bold 26px monospace':banner.includes('青龍波')?'bold 17px monospace':'bold 18px monospace';ctx.fillText(banner,320,167);ctx.textAlign='left'}
function drawCutin(){if(cutinT<=0)return;const im=cutin==='boss2'?imgs.boss2:imgs.boss1,total=1.45,elapsed=total-cutinT,enter=Math.min(1,elapsed/.16),exit=Math.min(1,cutinT/.18),alpha=Math.min(1,enter*1.7)*exit;ctx.save();ctx.globalAlpha=.88*alpha;ctx.fillStyle='#03050a';ctx.fillRect(0,0,W,H);ctx.globalAlpha=alpha;const bandY=50,bandH=260,scale=Math.max(W/im.width,bandH/im.height),dw=im.width*scale,dh=im.height*scale;ctx.beginPath();ctx.rect(0,bandY,W,bandH);ctx.clip();ctx.drawImage(im,(W-dw)/2,bandY+(bandH-dh)/2,dw,dh);ctx.restore();ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle='#ff2626';ctx.fillRect(0,44,W,4);ctx.fillRect(0,312,W,4);if(cutin==='boss2'){// guaranteed readable, unclipped text overlay
 ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(72,276,496,30);ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(73,277,494,28);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 17px sans-serif';ctx.fillText('お前に戦争がとめられるのか！？',320,298);ctx.textAlign='left'}ctx.restore()}
function drawSpecialCutin(){if(specialCutinT<=0)return;const im=imgs.special,total=.80,elapsed=total-specialCutinT,enter=Math.min(1,elapsed/.13),exit=Math.min(1,specialCutinT/.13),alpha=Math.min(1,enter*1.8)*exit;ctx.save();ctx.globalAlpha=.86*alpha;ctx.fillStyle='#020713';ctx.fillRect(0,0,W,H);ctx.globalAlpha=alpha;ctx.translate(player.facing<0?W:0,0);ctx.scale(player.facing<0?-1:1,1);const h=220,y=70,scale=Math.max(W/im.width,h/im.height),dw=im.width*scale,dh=im.height*scale;ctx.beginPath();ctx.rect(0,y,W,h);ctx.clip();ctx.drawImage(im,(W-dw)/2,y+(h-dh)/2,dw,dh);ctx.restore();ctx.fillStyle='#63e8ff';ctx.fillRect(0,64,W,4);ctx.fillRect(0,294,W,4)}
function drawPlay(){const mag=shake>0?Math.min(8,2+shake*18):0,ox=mag?(Math.random()-.5)*mag:0,oy=mag?(Math.random()-.5)*mag:0;ctx.save();ctx.translate(ox,oy);stageNum===1?drawStage1():drawStage2();for(const p of projectiles)p.draw();for(const e of enemies)e.draw();drawPlayer();for(const s of sparks)drawSpark(s);ctx.restore();drawHud();drawBanner();drawCutin();drawSpecialCutin();if(flash>0){ctx.fillStyle=`rgba(130,220,255,${Math.min(.34,flash*2.8)})`;ctx.fillRect(0,0,W,H)}}
function drawTitle(){ctx.fillStyle='#041022';ctx.fillRect(0,0,W,H);const im=imgs.title,scale=Math.max(W/im.width,H/im.height),dw=im.width*scale,dh=im.height*scale;ctx.drawImage(im,(W-dw)/2,(H-dh)/2,dw,dh);ctx.fillStyle='rgba(2,8,18,.22)';ctx.fillRect(0,285,W,75);ctx.fillStyle='#0a1d3a';ctx.fillRect(224,303,192,34);ctx.strokeStyle='#79baff';ctx.lineWidth=2;ctx.strokeRect(225,304,190,32);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 17px monospace';ctx.fillText('GAME START',320,326);ctx.font='9px monospace';ctx.fillText('画面タップ / A / B でスタート',320,349);ctx.textAlign='left'}
C.addEventListener('pointerdown',e=>{audio.unlock();if(state==='title'){resetStage(1,false)}},{passive:true});
let startLatch=false;function titleKeyStart(){const pressed=actionDown('punch')||actionDown('jump');if(state==='title'&&pressed&&!startLatch){startLatch=true;resetStage(1,false)}if(!pressed)startLatch=false}
let last=0,acc=0;function loop(t){const dt=last?Math.min((t-last)/1000,.05):0;last=t;titleKeyStart();acc+=dt;while(acc>=1/120){update(1/120);acc-=1/120}if(state==='title')drawTitle();else drawPlay();requestAnimationFrame(loop)}
window.miteState=()=>({version:'RC1.05',state,stage:stageNum,x:Math.round(player.x),cameraX:Math.round(cameraX),hp:player.hp,power:player.power,combo:player.combo,enemyCount:enemies.filter(e=>!e.dead).length,bossHp:boss?.hp??null,score,dragonCount:projectiles.filter(p=>p instanceof Dragon).length});
})();
